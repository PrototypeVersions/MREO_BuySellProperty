name: Fix stale test expectations

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-stale-tests.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Update assertions for per-property portfolio fee
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/browser/marketplace.spec.js')
          s=p.read_text()
          # Keep the illustrative portfolio asking price at $4,804,450; only seller reserve assertions change.
          needle='await expect(page.locator("#seller-reserve")).toHaveText("$4,804,450");'
          if s.count(needle)!=2:
              raise SystemExit(f'Expected exactly 2 stale seller-reserve assertions, found {s.count(needle)}')
          s=s.replace(needle,'await expect(page.locator("#seller-reserve")).toHaveText("$4,953,450");')
          old='expect(after.exampleCatalogVersion).toBe(3);'
          if old not in s:
              raise SystemExit('Stale catalog-version assertion not found')
          s=s.replace(old,'expect(after.exampleCatalogVersion).toBe(4);',1)
          p.write_text(s)
          PY
      - run: npm test
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/browser/marketplace.spec.js
          git commit -m "Update browser tests for portfolio fee and catalog migration"
          git push origin HEAD:main
