name: Fix coordination stat alignment

on:
  push:
    paths:
      - .github/workflows/fix-coordination-stat-alignment.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Align workspace stat values
        run: python -c 'from pathlib import Path; p=Path("coordination.css"); s=p.read_text(); old=".workspace-stats span,.provider-summary-grid span{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:8px}"; new=".workspace-stats span,.provider-summary-grid span{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:8px;min-height:2.4em}"; assert old in s; p.write_text(s.replace(old,new,1))'
      - name: Commit change
        run: |
          git config user.name "PrototypeVersions"
          git config user.email "blakeaustinmyers01@gmail.com"
          git add coordination.css
          git commit -m "Align coordination workspace stat values"
          git push

# one-time alignment patch
