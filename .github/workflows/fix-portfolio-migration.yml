name: Fix portfolio migration safeguard

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-portfolio-migration.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Make existing demo portfolio migration safe
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('mreo-service.js')
          text=p.read_text()
          old='{id:"demo-portfolio",title:"Illustrative REO portfolio · 150 properties",minimum:Math.round(total.price)-C.feeFor({kind:"portfolio",portfolio:rows}),kind:"portfolio",portfolio:rows},'
          new='{id:"demo-portfolio",title:"Illustrative REO portfolio · 150 properties",minimum:rows.length?Math.round(total.price)-C.feeFor({kind:"portfolio",portfolio:rows}):1,kind:"portfolio",portfolio:rows},'
          if old in text:
              p.write_text(text.replace(old,new,1))
          elif new not in text:
              raise SystemExit('Expected demo portfolio expression not found')
          PY
      - name: Run unit tests
        run: npm test
      - name: Commit safeguard
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mreo-service.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Handle existing demo portfolio fee migration"
          git push origin HEAD:main
