name: Apply property media consistency

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Stabilize seller listing hero selection
        run: |
          python - <<'PY'
          from pathlib import Path
          ui = Path('mreo-ui.js')
          text = ui.read_text()
          marker = 'async function hydrateSellerThumbnails(container){'
          helper = 'function stableMediaIndex(key,count){\n if(!count)return 0;let hash=2166136261;for(const ch of String(key||"")){hash^=ch.charCodeAt(0);hash=Math.imul(hash,16777619);}return(hash>>>0)%count;\n}\n'
          if 'function stableMediaIndex(key,count)' not in text:
              if marker not in text:
                  raise SystemExit('Seller thumbnail function not found')
              text = text.replace(marker, helper + marker, 1)
          old = 'const chosen=photos[Math.floor(Math.random()*photos.length)]'
          new = 'const chosen=photos[stableMediaIndex(img.dataset.mediaKey,photos.length)]'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('Seller thumbnail selection expression not found')
          ui.write_text(text)
          props = Path('properties.html')
          p = props.read_text()
          p = p.replace('mreo-ui.js?v=20260914-blind-auction','mreo-ui.js?v=20260917-media')
          p = p.replace('property-flow.js?v=20260916','property-flow.js?v=20260917-media')
          props.write_text(p)
          PY
      - name: Run unit tests
        run: npm test
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mreo-ui.js properties.html
          if git diff --cached --quiet; then
            echo "No media consistency changes needed"
          else
            git commit -m "Keep seller listing hero images consistent"
            git push
          fi
