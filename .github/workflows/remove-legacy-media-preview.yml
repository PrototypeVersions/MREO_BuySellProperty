name: Remove legacy seller media preview

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-legacy-media-preview.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Remove duplicate legacy media preview
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('seller.html')
          s = p.read_text()
          old = '''                <div
                  id="media-preview"
                  class="media-preview"
                  aria-live="polite"
                ></div>

'''
          if old not in s:
              raise SystemExit('legacy media preview block not found')
          p.write_text(s.replace(old, '', 1))
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seller.html
          git commit -m "Remove duplicate seller media preview"
          git push
