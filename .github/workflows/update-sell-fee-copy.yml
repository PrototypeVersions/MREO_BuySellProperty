name: Update sell fee copy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-sell-fee-copy.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update seller and landing copy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, required=True):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  if required:
                      raise SystemExit(f"Expected text not found in {path}: {old[:120]!r}")
                  return False
              p.write_text(text.replace(old, new))
              return True

          # Home page seller pathway: make portfolio pricing explicit immediately.
          replace(
              "index.html",
              "Sell a property or an entire portfolio as is. Set your minimum and invite competing offers, with a $1,000 MREO fee only when the sale closes.",
              "Sell a property or an entire portfolio as is. Set your minimum and invite competing offers. MREO’s success fee is $1,000 per property, due only when a sale closes."
          )
          replace("index.html", "<span>Sell Property As Is</span>", "<span>Sell As Is</span>")

          # Approved pricing language on the home-page sell section.
          replace("index.html", "Your property. Its strongest opportunity.", "Your real estate. Its strongest opportunity.")
          replace(
              "index.html",
              "Bring buyers together around your property’s present condition. MREO’s auction-style connection gives each interested buyer an opportunity to improve an offer, helping you pursue top dollar without making repairs first.",
              "Bring buyers together around a property or portfolio offered as is. MREO’s auction-style connection gives each interested buyer an opportunity to improve an offer, helping you pursue top dollar without making repairs first."
          )
          replace(
              "index.html",
              "<div><strong>$1,000</strong><span>One MREO success fee, only if your property or entire portfolio sells.</span></div>",
              "<div><strong>$1,000 / property</strong><span>Success fee, due only when a sale closes. For portfolios, the fee is $1,000 for each property sold.</span></div>"
          )
          replace(
              "index.html",
              "With clear pricing instead of an open-ended assignment-fee model, you can see how much of the highest offer remains after MREO’s fee. Set your minimum; the required bid includes the $1,000 fee. Additional bid value belongs in your sale proceeds.",
              "With clear pricing instead of an open-ended assignment-fee model, you can see how much of an offer remains after MREO’s fee. Set the amount you want to receive; the required bid adds MREO’s $1,000-per-property success fee. Any additional bid value remains in your sale proceeds."
          )
          replace(
              "index.html",
              "Competitive bidding is designed to improve price discovery; the final price depends on buyer interest and property condition. Other closing costs and obligations are separate.",
              "Competitive bidding is designed to improve price discovery; the final price depends on buyer interest and the condition of the property or portfolio. Other closing costs and obligations are separate."
          )

          # Sell page: represent both single-property and portfolio sales from the top of the page.
          replace(
              "seller.html",
              'content="Search for property information and submit a property for sale through MREO."',
              'content="Sell a property or portfolio as is through MREO and invite competing offers."'
          )
          replace("seller.html", "<title>Sell Property As Is | MREO</title>", "<title>Sell Property or Portfolio As Is | MREO</title>")
          replace("seller.html", "Sell Property As Is", "Sell Property or Portfolio As Is", required=False)
          replace(
              "seller.html",
              "Search for your property, review the information that can be\n        identified automatically, and complete any remaining details\n        needed to prepare the property for sale.",
              "Sell one property or an entire portfolio as is. Choose your\n        path below, provide the relevant information, and prepare the\n        listing for auction."
          )
          replace("seller.html", "Your property. Its strongest opportunity.", "Your real estate. Its strongest opportunity.")
          replace(
              "seller.html",
              "Bring buyers together around your property’s present condition. MREO’s auction-style connection gives each interested buyer an opportunity to improve an offer, helping you pursue top dollar without making repairs first.",
              "Bring buyers together around a property or portfolio offered as is. MREO’s auction-style connection gives each interested buyer an opportunity to improve an offer, helping you pursue top dollar without making repairs first."
          )
          replace(
              "seller.html",
              "<div><strong>$1,000</strong><span>Success fee per property, only if the sale closes. A 150-property portfolio has a $150,000 fee.</span></div>",
              "<div><strong>$1,000 / property</strong><span>Success fee, due only when a sale closes. For portfolios, the fee is $1,000 for each property sold.</span></div>"
          )
          replace(
              "seller.html",
              "With clear pricing instead of an open-ended assignment-fee model, you can see how much of the highest offer remains after MREO’s fee. Set your minimum; the required bid includes a $1,000 fee for a single property or $1,000 per property in a portfolio. Additional bid value belongs in your sale proceeds.",
              "With clear pricing instead of an open-ended assignment-fee model, you can see how much of an offer remains after MREO’s fee. Set the amount you want to receive; the required bid adds MREO’s $1,000-per-property success fee. Any additional bid value remains in your sale proceeds."
          )
          replace(
              "seller.html",
              "Competitive bidding is designed to improve price discovery; the final price depends on buyer interest and property condition. Other closing costs and obligations are separate.",
              "Competitive bidding is designed to improve price discovery; the final price depends on buyer interest and the condition of the property or portfolio. Other closing costs and obligations are separate."
          )

          # Guard against the old misleading portfolio-fee language surviving in user-facing HTML.
          banned = [
              "One MREO success fee, only if your property or entire portfolio sells.",
              "with a $1,000 MREO fee only when the sale closes.",
              "required bid includes the $1,000 fee.",
              "A 150-property portfolio has a $150,000 fee."
          ]
          for path in Path('.').glob('*.html'):
              text = path.read_text()
              for phrase in banned:
                  if phrase in text:
                      raise SystemExit(f"Legacy fee wording remains in {path}: {phrase}")

          print("Updated seller-facing copy successfully.")
          PY

      - name: Run unit tests
        run: npm test

      - name: Commit copy updates
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html seller.html
          git commit -m "Clarify per-property seller fee across site"
          git push origin HEAD:main
