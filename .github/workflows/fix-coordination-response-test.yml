name: Fix coordination response test

on:
  push:
    paths:
      - .github/workflows/fix-coordination-response-test.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Fix regex escaping
        run: python -c 'from pathlib import Path; p=Path("tests/browser/coordination.spec.js"); s=p.read_text(); old=r"/coordination-service\\\\.html\\\\?/"; new=r"/coordination-service\.html\?/"; assert old in s; p.write_text(s.replace(old,new))'
      - name: Commit fix
        run: |
          git config user.name "PrototypeVersions"
          git config user.email "blakeaustinmyers01@gmail.com"
          git add tests/browser/coordination.spec.js
          git commit -m "Fix provider response browser test regex"
          git push
