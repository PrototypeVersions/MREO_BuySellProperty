name: Add seller media integration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-seller-media.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wire seller media into listings
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p=Path(path); text=p.read_text()
              if old not in text:
                  raise SystemExit(f"Expected text not found in {path}: {old[:160]!r}")
              p.write_text(text.replace(old,new,1))

          # IndexedDB-backed browser media storage. This keeps large image/video blobs
          # out of localStorage while the auction record stores only a lightweight key.
          p=Path('mreo-service.js'); text=p.read_text()
          if 'async function saveMedia(mediaKey,files)' not in text:
              marker='const uid=prefix=>prefix+"-"+crypto.randomUUID();\n'
              media=r'''const mediaDbName="mreo-media-v1:"+root;
          function openMediaDb(){
           if(!globalThis.indexedDB)return Promise.reject(Error("Browser media storage is unavailable."));
           return new Promise((resolve,reject)=>{const request=indexedDB.open(mediaDbName,1);request.onupgradeneeded=()=>{const db=request.result;if(!db.objectStoreNames.contains("media")){const store=db.createObjectStore("media",{keyPath:"id"});store.createIndex("mediaKey","mediaKey",{unique:false});}};request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error||Error("Media storage could not be opened."));});
          }
          async function getMedia(mediaKey){
           if(!mediaKey)return [];
           const db=await openMediaDb();
           return new Promise((resolve,reject)=>{const tx=db.transaction("media","readonly"),request=tx.objectStore("media").index("mediaKey").getAll(mediaKey);request.onsuccess=()=>resolve((request.result||[]).sort((a,b)=>(a.index||0)-(b.index||0)));request.onerror=()=>reject(request.error||Error("Seller media could not be loaded."));tx.oncomplete=()=>db.close();});
          }
          async function saveMedia(mediaKey,files){
           if(!mediaKey||!files?.length)return [];
           const prior=await getMedia(mediaKey),db=await openMediaDb(),items=Array.from(files).map((file,index)=>({id:mediaKey+":"+index,mediaKey,index,name:file.name||("media-"+(index+1)),type:file.type||"application/octet-stream",size:file.size||0,lastModified:file.lastModified||0,blob:file}));
           return new Promise((resolve,reject)=>{const tx=db.transaction("media","readwrite"),store=tx.objectStore("media");prior.forEach(item=>store.delete(item.id));items.forEach(item=>store.put(item));tx.oncomplete=()=>{db.close();resolve(items.map(({blob,...item})=>item));};tx.onerror=()=>{db.close();reject(tx.error||Error("Seller media could not be saved in this browser."));};tx.onabort=()=>{db.close();reject(tx.error||Error("Seller media could not be saved in this browser."));};});
          }
          '''
              if marker not in text: raise SystemExit('uid marker not found')
              text=text.replace(marker,marker+media,1)

          old='const auction=C.createAuction({id,title:draft.title,sellerId:a.id,minimum:draft.minimum,days:draft.days,kind:draft.kind,portfolio:draft.portfolio||[],demo:true});\n auction.example=false;s.auctions[id]=auction;a.submission.auctionId=id;write(s);return {auctionId:id};'
          new='const auction=C.createAuction({id,title:draft.title,sellerId:a.id,minimum:draft.minimum,days:draft.days,kind:draft.kind,portfolio:draft.portfolio||[],demo:true});\n auction.example=false;auction.mediaKey=draft.draftId||"";auction.details=draft.details||{};s.auctions[id]=auction;a.submission.auctionId=id;write(s);return {auctionId:id};'
          if old not in text: raise SystemExit('activate auction block not found')
          text=text.replace(old,new,1)

          old='return auctions.map(({id,title,kind,reserve,portfolio,portfolioCount,status,endsAt,example})=>({id,title,kind,reserve,portfolioCount:portfolioCount??portfolio?.length??0,status,endsAt,example}));'
          new='return auctions.map(({id,title,kind,reserve,portfolio,portfolioCount,status,endsAt,example,mediaKey,details})=>({id,title,kind,reserve,portfolioCount:portfolioCount??portfolio?.length??0,status,endsAt,example,mediaKey:mediaKey||"",details:details||{}}));'
          if old not in text: raise SystemExit('list mapping block not found')
          text=text.replace(old,new,1)

          old='globalThis.MreoService={demo,key,init,register,me,checkout,confirm,activate,list,auction,bid,finish,restart,completeSale,session,currentRole,setRole,clear};'
          new='globalThis.MreoService={demo,key,init,register,me,checkout,confirm,activate,list,auction,bid,finish,restart,completeSale,session,currentRole,setRole,clear,saveMedia,getMedia};'
          if old not in text: raise SystemExit('service export block not found')
          text=text.replace(old,new,1); p.write_text(text)

          # Save the selected File objects after the seller draft has an ID.
          p=Path('mreo-ui.js'); text=p.read_text()
          old='await S.register("seller",{name:field("seller-name"),email:field("seller-email")},submission);\n location.href="payment.html?role=seller";'
          new='const account=await S.register("seller",{name:field("seller-name"),email:field("seller-email")},submission);\n const mediaFiles=$("property-media")?.files;if(!portfolio&&mediaFiles?.length&&account?.submission?.draftId)await S.saveMedia(account.submission.draftId,mediaFiles);\n location.href="payment.html?role=seller";'
          if old not in text: raise SystemExit('seller register block not found')
          text=text.replace(old,new,1)

          if 'function sellerDetailHref(a)' not in text:
              marker='function marketplace(){\n'
              helpers=r'''function sellerDetailHref(a){
           const d=a.details||{},q=new URLSearchParams();q.set("auction",a.id);q.set("address",a.title);q.set("price",String(a.reserve||""));q.set("image","assets/property-placeholder.svg");q.set("location",[d.propertyCity,d.propertyState].filter(Boolean).join(", ")||(S.demo?"Your test listing":"Seller listing"));q.set("description",d.propertyConditionNotes||d.propertyDescription||"Seller-provided as-is property listing.");if(d.propertySize)q.set("size",d.propertySize+" sq ft");if(d.propertyBedrooms||d.propertyBathrooms)q.set("bedsBaths",[d.propertyBedrooms||"NA",d.propertyBathrooms||"NA"].join(" / "));if(d.propertyType)q.set("type",d.propertyType);if(a.mediaKey)q.set("mediaKey",a.mediaKey);return "property.html?"+q.toString();
          }
          async function hydrateSellerThumbnails(container){
           const images=[...container.querySelectorAll("img[data-media-key]")];await Promise.all(images.map(async img=>{try{const media=await S.getMedia(img.dataset.mediaKey),photos=media.filter(item=>(item.type||"").startsWith("image/")&&item.blob);if(!photos.length)return;const chosen=photos[Math.floor(Math.random()*photos.length)],url=URL.createObjectURL(chosen.blob);img.src=url;img.alt="Seller-provided property photograph";}catch{}}));
          }
          '''
              if marker not in text: raise SystemExit('marketplace marker not found')
              text=text.replace(marker,helpers+marker,1)

          import re
          pattern=r'''return '<article class="property-row"><div class="property-thumbnail"><img src="assets/property-placeholder\.svg" alt="Property awaiting seller photographs" loading="lazy"></div><div class="property-main-info"><p class="property-location">'\+\(S\.demo\?"Your test listing":"Seller listing"\)\+'</p><h2>'\+esc\(a\.title\)\+'</h2><p>As-is property</p></div><div class="property-facts"><div><span class="property-fact-label">Required bid</span><strong>'\+cash\(a\.reserve\)\+'</strong></div></div><div class="property-action"><a class="primary-button" href="auction\.html\?id='\+encodeURIComponent\(a\.id\)\+'">View auction</a></div></article>';'''
          repl=r'''return '<article class="property-row"><div class="property-thumbnail"><img src="assets/property-placeholder.svg" data-media-key="'+esc(a.mediaKey||"")+'" alt="Property awaiting seller photographs" loading="lazy"></div><div class="property-main-info"><p class="property-location">'+esc([a.details?.propertyCity,a.details?.propertyState].filter(Boolean).join(", ")||(S.demo?"Your test listing":"Seller listing"))+'</p><h2>'+esc(a.title)+'</h2><p class="property-description">Seller-provided as-is property listing.</p></div><div class="property-facts"><div><span class="property-fact-label">Required bid</span><strong>'+cash(a.reserve)+'</strong></div></div><div class="property-action"><a class="primary-button button-blue" href="'+sellerDetailHref(a)+'">View / Prepare Interest</a></div></article>';'''
          text2,n=re.subn(pattern,repl,text,count=1)
          if n!=1: raise SystemExit(f'seller marketplace card not replaced: {n}')
          text=text2

          old='  }).join("");\n }).catch(e=>message("marketplace-message",e.message,true));\n}'
          new='  }).join("");\n  return hydrateSellerThumbnails(container);\n }).catch(e=>message("marketplace-message",e.message,true));\n}'
          if old not in text: raise SystemExit('marketplace completion block not found')
          text=text.replace(old,new,1);p.write_text(text)

          # Property detail page: create a gallery for every seller-uploaded image/video.
          replace('property.html','    <div class="single-property-media"><img id="property-detail-image" alt="Property image"></div>','    <div class="single-property-media"><img id="property-detail-image" alt="Property image"></div>\n    <section class="seller-media-section" id="seller-media-section" aria-labelledby="seller-media-heading" hidden>\n      <p class="section-label">Seller media</p>\n      <h2 id="seller-media-heading">Property images and videos</h2>\n      <div class="seller-media-grid" id="seller-media-gallery"></div>\n    </section>')

          p=Path('property-flow.js'); text=p.read_text()
          text=text.replace('["auction", "address", "price", "image", "description", "location", "size", "bedsBaths", "condition", "type"].forEach((key) => {','["auction", "address", "price", "image", "description", "location", "size", "bedsBaths", "condition", "type", "mediaKey"].forEach((key) => {',1)
          if 'async function loadSellerMedia(' not in text:
              marker='  function populateDetailPage() {\n'
              helper=r'''  async function loadSellerMedia(mediaKey,address) {
            if (!mediaKey || !globalThis.MreoService?.getMedia) return;
            const media = await globalThis.MreoService.getMedia(mediaKey);
            if (!media.length) return;
            const section = document.getElementById("seller-media-section");
            const gallery = document.getElementById("seller-media-gallery");
            if (!section || !gallery) return;
            gallery.innerHTML = "";
            const photos = media.filter(item => (item.type || "").startsWith("image/") && item.blob);
            if (photos.length) {
              const main = document.getElementById("property-detail-image");
              const chosen = photos[Math.floor(Math.random() * photos.length)];
              main.src = URL.createObjectURL(chosen.blob);
              main.alt = "Seller-provided property photograph for " + address;
              main.closest(".single-property-media").hidden = false;
            }
            media.forEach((item,index) => {
              if (!item.blob) return;
              const figure = document.createElement("figure");
              const url = URL.createObjectURL(item.blob);
              if ((item.type || "").startsWith("image/")) {
                const img = document.createElement("img"); img.src = url; img.alt = item.name || ("Property photograph " + (index + 1)); img.loading = "lazy"; figure.appendChild(img);
              } else if ((item.type || "").startsWith("video/")) {
                const video = document.createElement("video"); video.src = url; video.controls = true; video.preload = "metadata"; video.setAttribute("playsinline", ""); video.setAttribute("aria-label", item.name || ("Property video " + (index + 1))); figure.appendChild(video);
              } else return;
              const caption = document.createElement("figcaption"); caption.textContent = item.name || ("Seller media " + (index + 1)); figure.appendChild(caption); gallery.appendChild(figure);
            });
            section.hidden = gallery.children.length === 0;
          }

          '''
              if marker not in text: raise SystemExit('populateDetailPage marker not found')
              text=text.replace(marker,helper+marker,1)
          old='    document.getElementById("property-coordinate").href = "coordination.html?" + contextQuery().toString();\n  }'
          new='    document.getElementById("property-coordinate").href = "coordination.html?" + contextQuery().toString();\n    const mediaKey = params.get("mediaKey");\n    if (mediaKey) loadSellerMedia(mediaKey, address).catch(() => {});\n  }'
          if old not in text: raise SystemExit('property detail ending not found')
          text=text.replace(old,new,1);p.write_text(text)

          # Gallery styling.
          p=Path('marketplace.css'); text=p.read_text()
          css='''\n/* Seller-provided media on property detail pages. */\n.seller-media-section{margin:34px 0 42px}.seller-media-section h2{font-size:clamp(24px,3vw,34px);letter-spacing:-.03em;margin:0 0 22px}.seller-media-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.seller-media-grid figure{margin:0;min-width:0;background:#eeeae0}.seller-media-grid img,.seller-media-grid video{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:#111}.seller-media-grid figcaption{padding:10px 12px;font-size:12px;color:var(--muted);background:#f4f1e8}@media(max-width:600px){.seller-media-grid{grid-template-columns:1fr}}\n'''
          if 'Seller-provided media on property detail pages' not in text: p.write_text(text+css)

          # Regression test: media survives seller draft -> auction -> marketplace -> detail.
          p=Path('tests/browser/coordination.spec.js'); text=p.read_text()
          test=r'''
          test("seller-created listing uses uploaded images and exposes all uploaded media",async({page})=>{
           await page.goto("/seller.html");
           const created=await page.evaluate(async()=>{
            const submission={title:"77 Seller Media Way, Dallas, TX 75201",kind:"property",minimum:200000,days:1,portfolio:[],details:{propertyCity:"Dallas",propertyState:"TX",propertySize:"1800",propertyBedrooms:"3",propertyBathrooms:"2",propertyType:"Single-family home"}};
            const account=await MreoService.register("seller",{name:"Media Seller",email:"media-seller@example.com"},submission);
            const png=new File([new Uint8Array([137,80,78,71,13,10,26,10])],"front.png",{type:"image/png"});
            const jpg=new File([new Uint8Array([255,216,255,217])],"back.jpg",{type:"image/jpeg"});
            const mp4=new File([new Uint8Array([0,0,0,24,102,116,121,112])],"walkthrough.mp4",{type:"video/mp4"});
            await MreoService.saveMedia(account.submission.draftId,[png,jpg,mp4]);
            await MreoService.checkout("seller",true);return await MreoService.activate("seller");
           });
           await page.goto("/properties.html");
           const row=page.locator("#new-listings .property-row").filter({hasText:"77 Seller Media Way"});
           await expect(row.getByRole("link",{name:"View / Prepare Interest"})).toBeVisible();
           await expect.poll(async()=>await row.locator(".property-thumbnail img").getAttribute("src")).toMatch(/^blob:/);
           await row.getByRole("link",{name:"View / Prepare Interest"}).click();
           expect(new URL(page.url()).searchParams.get("auction")).toBe(created.auctionId);
           await expect(page.locator("#seller-media-section")).toBeVisible();
           await expect(page.locator("#seller-media-gallery img")).toHaveCount(2);
           await expect(page.locator("#seller-media-gallery video")).toHaveCount(1);
           await expect(page.locator("#seller-media-gallery")).toContainText("front.png");
           await expect(page.locator("#seller-media-gallery")).toContainText("back.jpg");
           await expect(page.locator("#seller-media-gallery")).toContainText("walkthrough.mp4");
           const interest=page.getByRole("link",{name:"Prepare Interest"});
           expect(new URL(await interest.getAttribute("href"),page.url()).searchParams.get("auction")).toBe(created.auctionId);
          });
          '''
          if 'seller-created listing uses uploaded images' not in text: p.write_text(text+test)

          print('Seller media integration applied.')
          PY

      - name: Run unit tests
        run: npm test

      - name: Commit seller media integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mreo-service.js mreo-ui.js property-flow.js property.html marketplace.css tests/browser/coordination.spec.js
          git commit -m "Use seller media in property listings and detail pages"
          git push origin HEAD:main
