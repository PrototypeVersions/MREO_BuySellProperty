name: Apply seller media picker

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-seller-media-picker.yml'
      - '.github/scripts/apply_seller_media_picker.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Build seller media preview picker
        run: python .github/scripts/apply_seller_media_picker.py
      - name: Run unit tests
        run: npm test
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mreo-ui.js marketplace.css seller.html
          git commit -m "Show all selected seller media"
          git push
