name: Apply provider response workflow

on:
  push:
    paths:
      - .github/workflows/apply-provider-response-v2.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Apply provider response integration
        run: python scripts/apply_provider_response_v2.py
      - name: Verify JavaScript syntax
        run: |
          node --check coordination-response.js
          node --check coordination-response-enhancements.js
          node --check coordination.js
      - name: Commit integration
        run: |
          git config user.name "PrototypeVersions"
          git config user.email "blakeaustinmyers01@gmail.com"
          git add coordination.html coordination-service.html coordination.js tests/browser/coordination.spec.js
          git commit -m "Add provider response review and revision workflows"
          git push
