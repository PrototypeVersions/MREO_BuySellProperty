name: Verify seller media flow

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-seller-media.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/browser/coordination.spec.js --project=chromium
