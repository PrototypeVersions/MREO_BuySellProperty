name: Apply legacy media preview removal

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-remove-legacy-media-preview.yml'
      - '.github/scripts/remove_legacy_media_preview.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Remove duplicate legacy preview
        run: python .github/scripts/remove_legacy_media_preview.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seller.html
          git commit -m "Remove duplicate seller media preview"
          git push
