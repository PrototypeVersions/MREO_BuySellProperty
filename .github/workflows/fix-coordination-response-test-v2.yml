name: Fix coordination response test v2

on:
  push:
    paths:
      - .github/workflows/fix-coordination-response-test-v2.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Fix browser test assertion
        run: python scripts/fix_coordination_response_test.py
      - name: Commit test fix
        run: |
          git config user.name "PrototypeVersions"
          git config user.email "blakeaustinmyers01@gmail.com"
          git add tests/browser/coordination.spec.js
          git commit -m "Fix provider response revision browser test"
          git push
