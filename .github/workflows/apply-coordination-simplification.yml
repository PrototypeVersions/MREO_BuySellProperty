name: Apply coordination simplification

on:
  push:
    paths:
      - scripts/apply_coordination_simplification.py
      - .github/workflows/apply-coordination-simplification.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python scripts/apply_coordination_simplification.py
      - name: Commit changes
        run: |
          git config user.name "PrototypeVersions"
          git config user.email "blakeaustinmyers01@gmail.com"
          git add coordination.js coordination.html coordination-service.html coordination.css tests/browser/coordination.spec.js tests/browser/auction-handoff.spec.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Simplify coordination handoffs and closing flow"
            git push
          fi
