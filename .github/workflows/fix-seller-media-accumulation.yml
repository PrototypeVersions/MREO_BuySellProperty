name: Fix seller media accumulation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-seller-media-accumulation.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Accumulate seller media selections
        run: |
          python - <<'PY'
          from pathlib import Path

          ui = Path('mreo-ui.js')
          text = ui.read_text()

          old = 'let uploadedRows=[],uploadPromise=null,xlsxPromise=null,readyPromise=Promise.resolve();'
          new = 'let uploadedRows=[],selectedMediaFiles=[],uploadPromise=null,xlsxPromise=null,readyPromise=Promise.resolve();'
          if old not in text:
              raise SystemExit('Module state marker not found')
          text = text.replace(old, new, 1)

          marker = 'function setupSeller(){\n if(!$("seller-form"))return;'
          replacement = '''function setupSeller(){
 if(!$("seller-form"))return;
 const mediaInput=$("property-media");
 if(mediaInput){
  const uploadArea=mediaInput.closest(".upload-area"),note=uploadArea?.querySelector(".upload-note");
  const renderMediaSelection=()=>{
   if(!note)return;
   if(!selectedMediaFiles.length){note.textContent="You can select multiple files. If you choose more files later, they will be added to this list.";return;}
   const names=selectedMediaFiles.map(file=>file.name).join(", ");
   note.textContent=selectedMediaFiles.length+" file"+(selectedMediaFiles.length===1?"":"s")+" selected: "+names+". Choose more files to add them.";
  };
  mediaInput.addEventListener("change",()=>{
   const incoming=[...(mediaInput.files||[])];
   const seen=new Set(selectedMediaFiles.map(file=>[file.name,file.size,file.lastModified,file.type].join("|")));
   for(const file of incoming){
    const key=[file.name,file.size,file.lastModified,file.type].join("|");
    if(!seen.has(key)){selectedMediaFiles.push(file);seen.add(key);}
   }
   renderMediaSelection();
  });
  renderMediaSelection();
 }'''
          if marker not in text:
              raise SystemExit('setupSeller marker not found')
          text = text.replace(marker, replacement, 1)

          old_submit = 'const mediaFiles=$("property-media")?.files;if(!portfolio&&mediaFiles?.length&&account?.submission?.draftId)await S.saveMedia(account.submission.draftId,mediaFiles);'
          new_submit = 'const mediaFiles=selectedMediaFiles;if(!portfolio&&mediaFiles.length&&account?.submission?.draftId)await S.saveMedia(account.submission.draftId,mediaFiles);'
          if old_submit not in text:
              raise SystemExit('Seller media submit marker not found')
          text = text.replace(old_submit, new_submit, 1)
          ui.write_text(text)

          seller = Path('seller.html')
          s = seller.read_text()
          s = s.replace('mreo-ui.js?v=20260914-blind-auction','mreo-ui.js?v=20260917-media-accumulate')
          seller.write_text(s)
          PY
      - name: Run unit tests
        run: npm test
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mreo-ui.js seller.html
          git commit -m "Allow seller media selections to accumulate"
          git push
